name: order-tracker

services:
  app:
    image: order-tracker:${ORDER_TRACKER_TAG:-local}
    build: .
    ports:
      - "127.0.0.1:${ORDER_TRACKER_PORT:-8000}:8000"
    environment:
      ORDER_DB_PATH: /data/orders.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: order-tracker
    volumes:
      - orders:/data
    restart: unless-stopped
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      ALERT_WEBHOOK_USERNAME: ${ALERT_WEBHOOK_USERNAME:-grafana}
      ALERT_WEBHOOK_PASSWORD: ${ALERT_WEBHOOK_PASSWORD:-order-tracker-alerts}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  incident-response:
    image: incident-response:${ORDER_TRACKER_TAG:-local}
    build: ./incident-response
    ports:
      - "127.0.0.1:${INCIDENT_RESPONSE_PORT:-8001}:8001"
    environment:
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      INCIDENTS_DIR: /data/incidents
      REPO_DIR: /workspace
      ALERT_WEBHOOK_USERNAME: ${ALERT_WEBHOOK_USERNAME:-grafana}
      ALERT_WEBHOOK_PASSWORD: ${ALERT_WEBHOOK_PASSWORD:-order-tracker-alerts}
      AUTO_INVOKE_ASSISTANT: ${AUTO_INVOKE_ASSISTANT:-true}
      ASSISTANT_COMMAND: ${ASSISTANT_COMMAND:-copilot}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_TIMEOUT_SECONDS: ${ASSISTANT_TIMEOUT_SECONDS:-1800}
      ASSISTANT_COOLDOWN_SECONDS: ${ASSISTANT_COOLDOWN_SECONDS:-600}
      GH_TOKEN: ${GH_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: incident-response
    volumes:
      - incidents:/data/incidents
      - .:/workspace
    depends_on:
      - loki
      - tempo
      - otel-collector
    restart: unless-stopped

volumes:
  orders:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  incidents:

networks:
  default:
    ipam:
      config:
        - subnet: ${ORDER_TRACKER_SUBNET:-10.215.24.0/24}
